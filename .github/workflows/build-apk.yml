name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Accept licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Build NewBlackbox engine AAR
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13846066" || true
          git clone --depth 1 https://github.com/ALEX5402/NewBlackbox.git /tmp/nbb
          cd /tmp/nbb
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          find . -name "*.aar" -path "*outputs/aar*" -exec cp {} "$GITHUB_WORKSPACE/app/libs/" \;
          ls -la "$GITHUB_WORKSPACE/app/libs"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SamCloner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
